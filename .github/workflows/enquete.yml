
name: Enquête (robot horaire)

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enquete
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --version

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Vérifier la configuration
        run: |
          python --version
          python -m pip check
          test -f run.py
          test -f requirements.txt

      - name: Analyse
        env:
          MAX_DOCS: "25"
          PYTHONUNBUFFERED: "1"
        run: python -u run.py

      - name: Publier les données
        run: |
          git config user.name "enquete-bot"
          git config user.email "bot@users.noreply.github.com"

          if [ -d data ]; then
            git add -A data/
          else
            echo "Le dossier data/ n'existe pas."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
          else
            git commit -m "maj analyse $(date -u +%FT%TZ)"
            git push
          fi
